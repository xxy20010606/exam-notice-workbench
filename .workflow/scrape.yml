version: '1.0'
name: exam-notice-scrape
displayName: exam-notice-scrape

# 触发器：仅 push main（方案X：Gitee Go 手动/schedule 资源池报 agents not available，
# 但 push 触发走不同资源池可能能跑。由 GitHub Actions scrape-cloud 每6小时跑完
# push main → 此处 Gitee Go 收到 push 事件 → 在国内 IP 补抓一次）
triggers:
  push:
    branches:
      precise:
        - main
    commitMessages: []   # 不过滤 commit message，避免被防重入锁死

# 注：schedule 段已移除——Gitee Go 定时/手动触发资源池报 agents not available，
# 且 cron 字段在个人版文档缺失易踩坑。保留 push 触发（GitHub Actions scrape-cloud
# 每6小时跑完会 push main → 此处 Gitee Go 收到 push 在国内 IP 补抓一次）

stages:
  - name: scrape
    displayName: 抓取公告
    strategy: naturally   # 自然失败（并行任务互不影响；本流水线单 stage 不影响）
    trigger: auto
    steps:
      - step: shell@agent    # 自定义 shell 脚本插件（官方插件标识）
        name: run-scrape
        displayName: 抓取并推回 GitHub
        # hostGroupID 可不填，用 Gitee Go 默认 linux agent
        script: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          # 国内 CI 常封锁 SSH 端口 22，强制走 HTTPS（push.sh 已配 SSH，此处可保 HTTPS fallback）
          git config --global url."https://github.com/".insteadOf "git@github.com:" || true
          # 装依赖
          pip install -r requirements.txt -q
          # 装 playwright chromium（忽略失败以防无网环境）
          playwright install chromium 2>/dev/null || true
          # 抓取并按 .has_change 推回 GitHub main
          bash ci_scrape.sh