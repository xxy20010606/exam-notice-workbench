version: '1.0'
name: exam-notice-scrape

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时（Gitee Go 用标准 5 段 cron）
  push:
    branches:
      - main

stages:
  scrape:
    stage: scrape
    steps:
      - name: "安装依赖并抓取"
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          # 国内 CI 常封锁 SSH 端口 22，强制走 HTTPS
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          pip install -r requirements.txt -q
          playwright install chromium 2>/dev/null || true
          bash ci_scrape.sh
