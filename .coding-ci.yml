# 腾讯云 CODING 持续集成 — 公考事考公告抓取
# 国内 IP 直连 gov.cn，解决 GitHub Actions 海外 IP 被封问题
# 用法：导入到 dev.tencent.com 项目 → 开启持续集成 → 定时触发

name: exam-notice-scrape

trigger_config:
  trigger_type: cron
  cron_expr: "0 */6 * * *"  # 每 6 小时（与 GHA scrape-cloud 对齐）
  enable: true

# 手动触发也保留
on:
  push:
    branches:
      include:
        - main
  mr:
    target_branches:
      include:
        - main

stages:
  - name: 抓取并部署
    strategy: naturally
    triggers: manual
    steps:
      - step: shell@1
        name: 运行抓取脚本(国内IP直连+推回GitHub)
        with:
          content: |-
            set -e
            echo "=== 运行 ci_scrape.sh（国内IP直连 gov.cn，仅 .has_change>0 才推回 GitHub main）==="
            bash ci_scrape.sh
            echo "=== 抓取结束 ==="
