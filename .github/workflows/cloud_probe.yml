name: 云端可达性探针（手动）

# 目的：回答「电脑不开机时，云端到底能抓到几个源」。
# 本地跑全绿只是因为走了国内 IP；云端是海外 IP，国内 gov.cn 的封锁程度必须实测。
#
# 只在手动点击时运行，跑完只输出报告 —— **不提交任何文件**（权限只给 read），
# 也不写 sources_status，不会污染健康度。
on:
  workflow_dispatch:
    inputs:
      only_region:
        description: '只测某个地区（如 浙江 / 江苏 / 上海），留空=全部。全量跑 browser 源会超时，建议分区'
        required: false
        default: ''
      skip_browser:
        description: '跳过 browser 源（只测 http/api，1-2 分钟出结果）'
        type: boolean
        default: false
      http_on_browser:
        description: '对 browser 源改用纯 http 直取（判断是网络封锁还是只有浏览器不通）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # 全量实测约 50-60 分钟（34 个 browser 源串行，单个 browser_timeout 90s × 重试）。
    # 第一次设 45 分钟被砍了。想快就用 only_region 分区跑，一个省约 5-10 分钟。
    timeout-minutes: 75
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright Chromium（含系统依赖）
        # 与 scrape.yml 保持一致：不缓存浏览器，每轮现装。
        # 缓存 key 用 hashFiles('requirements.txt') 而该文件不锁版本，会永久命中旧浏览器，
        # 导致 34 个 browser 源在云端静默失效（详见 scrape.yml 里的踩坑注释）。
        #
        # 但**跳过 browser 源时就不要装了**：--with-deps 会 apt 装 libnss3 等一大串系统库，
        # 单这一步就要 8 分钟左右。之前不论参数怎么传都装，于是
        # 「only_region=江苏 + skip_browser」这种一秒都不跑浏览器的探针也要 13 分钟，
        # 而实际跑源只用了 5 分钟。http_on_browser 模式同理（它是用纯 http 取页面）。
        if: "${{ inputs.skip_browser != true && inputs.http_on_browser != true }}"
        run: python -m playwright install --with-deps chromium

      - name: 跑探针（不写状态 / 不提交）
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.only_region }}" ]; then
            ARGS="$ARGS --only-region ${{ inputs.only_region }}"
          fi
          if [ "${{ inputs.skip_browser }}" = "true" ]; then
            ARGS="$ARGS --skip-browser"
          fi
          if [ "${{ inputs.http_on_browser }}" = "true" ]; then
            ARGS="$ARGS --http-on-browser"
          fi
          echo "探针参数：${ARGS:-（全量）}"
          python probe_cloud.py $ARGS
