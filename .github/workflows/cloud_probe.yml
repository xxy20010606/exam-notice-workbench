name: 云端可达性探针（手动）

# 目的：回答「电脑不开机时，云端到底能抓到几个源」。
# 本地跑全绿只是因为走了国内 IP；云端是海外 IP，国内 gov.cn 的封锁程度必须实测。
#
# 只在手动点击时运行，跑完只输出报告 —— **不提交任何文件**（权限只给 read），
# 也不写 sources_status，不会污染健康度。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright Chromium（含系统依赖）
        # 与 scrape.yml 保持一致：不缓存浏览器，每轮现装。
        # 缓存 key 用 hashFiles('requirements.txt') 而该文件不锁版本，会永久命中旧浏览器，
        # 导致 34 个 browser 源在云端静默失效（详见 scrape.yml 里的踩坑注释）。
        run: python -m playwright install --with-deps chromium

      - name: 跑探针（全量源 / 不写状态 / 不提交）
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
        run: python probe_cloud.py
