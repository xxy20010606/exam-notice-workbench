name: 公考事考公告抓取

on:
  push:
    branches: [main]
    paths:
      - 'sources.json'
      - 'scraper.py'
      - 'cloud_run.py'
      - 'build_dashboard*.py'
      - 'service-worker.js'
      - 'requirements.txt'
      - '.github/workflows/scrape.yml'
  schedule:
    # 每 6 小时跑一次（分钟取 17 避免整点拥堵）
    - cron: '17 */6 * * *'
  workflow_dispatch: {}      # 允许在 GitHub 上手动触发

permissions:
  contents: write            # 提交更新后的 notices.db / index.html
  pages: write               # 发布看板到 GitHub Pages
  id-token: write

jobs:
  # ---------- 云端：抓取所有源（含浙江），关机也自动更新 ----------
  # scraper.py 已加 --disable-ipv6 强制 IPv4，GitHub 托管 ubuntu 本身是 IPv4 出口，
  # 浙江 gov.cn 在云端即可直接抓取，无需本地 Runner。
  # 防自循环：自己抓到数据后的提交（message 含“定时更新公告”）不再触发新一轮；
  # 源码变更（paths 命中）或定时/手动触发时正常抓取全部地区。
  scrape-cloud:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'push' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '定时更新公告'))
    concurrency:
      group: cloud-scrape
      cancel-in-progress: true   # 新一次抓取开始就取消上一次，避免重叠写库
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 配置 Python（自动缓存 pip 依赖）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 还原 Playwright 浏览器缓存（命中则跳过下载）
        id: pwcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 安装 Playwright Chromium（仅缓存未命中时执行）
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: 保存 Playwright 浏览器缓存（首次安装后才会有内容）
        if: steps.pwcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pwcache-primary-key }}

      - name: 抓取并更新看板（含浙江全部地区）
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
        run: python cloud_run.py

      - name: 提交更新
        run: |
          NEW_COUNT=$(cat .new_count 2>/dev/null || echo 0)
          if [ "$NEW_COUNT" -le 0 ]; then
            echo "[跳过] 本次无新增公告，不提交不推送（避免自循环）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 定时更新公告(云端) $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: 部署 Pages
        uses: actions/deploy-pages@v5
