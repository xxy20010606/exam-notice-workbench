name: 公考事考公告抓取

on:
  push:
    branches: [main]
    paths:
      - 'sources.json'
      - 'scraper.py'
      - 'cloud_run.py'
      - 'cloud_run_lite.py'
      - 'build_dashboard*.py'
      - 'service-worker.js'
      - 'requirements.txt'
      - '.github/workflows/scrape.yml'
      - 'notices.db'
  schedule:
    # 每 6 小时跑一次（分钟取 17 避免整点拥堵）
    - cron: '17 */6 * * *'
    # 额外补一次：UTC 10:15 = 北京 18:15，赶在 19:00 日报邮件前刷新数据
    - cron: '15 10 * * *'
  workflow_dispatch: {}      # 允许在 GitHub 上手动触发

permissions:
  contents: write            # 提交更新后的 notices.db / index.html
  pages: write               # 发布看板到 GitHub Pages
  id-token: write

jobs:
  # ---------- 云端：抓取所有源（含浙江），关机也自动更新 ----------
  # scraper.py 已加 --disable-ipv6 强制 IPv4，GitHub 托管 ubuntu 本身是 IPv4 出口，
  # 浙江 gov.cn 在云端即可直接抓取，无需本地 Runner。
  # 防自循环：自己抓到数据后的提交（message 含“定时更新公告”）不再触发新一轮；
  # 源码变更（paths 命中）或定时/手动触发时正常抓取全部地区。
  scrape-cloud:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'push' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '定时更新公告') && !contains(github.event.head_commit.message, 'WorkBuddy国内抓取'))
    concurrency:
      group: cloud-scrape
      cancel-in-progress: true   # 新一次抓取开始就取消上一次，避免重叠写库
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 配置 Python（自动缓存 pip 依赖）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 校验 sources.json（防呆：坏配置在抓取前即失败，避免把错误配置推上云端 scraper）
        run: python validate_sources.py

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 还原 Playwright 浏览器缓存（命中则跳过下载）
        id: pwcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 安装 Playwright Chromium（仅缓存未命中时执行）
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: 保存 Playwright 浏览器缓存（首次安装后才会有内容）
        if: steps.pwcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pwcache-primary-key }}

      - name: 抓取并更新看板（含浙江全部地区）
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
          # 国内代理（可选）：值形如 http://user:pass@host:port 或 http://host:port
          # 未配置该 Secret 时留空 → 纯直连（当前行为，不影响任何现有源）
          # 配置后：抓取先直连，被封的 gov.cn 源直连失败会自动回退走此代理
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
        run: python cloud_run.py

      - name: 提交更新
        run: |
          # 任何数据变化都推送：新增 / 清噪声 / 回填日期（避免数据质量改动被锁死）
          HAS_CHANGE=$(cat .has_change 2>/dev/null || echo 0)
          if [ "$HAS_CHANGE" -le 0 ]; then
            echo "[跳过] 本次无数据变化（无新增/无清理/无回填），不提交不推送"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 定时更新公告(云端) $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: 部署 Pages
        uses: actions/deploy-pages@v5

  # ---------- WorkBuddy 国内通道：国内自动化 push 的数据 commit 只重建看板并部署 ----------
  # 国内自动化（WorkBuddy 沙箱，中国出口 IP）抓取非 browser 源并 push notices.db/index.html，
  # message 含「WorkBuddy国内抓取」。此 job 不抓取，仅用最新库重建看板并发布 Pages，
  # 解决「数据 commit 不在 push.paths 内、GHA 抓取 job 又被海外 IP 封锁」的部署断点。
  deploy-wb:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && contains(github.event.head_commit.message, 'WorkBuddy国内抓取')
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 重建看板（用 push 来的最新 notices.db）
        run: python build_dashboard.py

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: 部署 Pages
        uses: actions/deploy-pages@v5
