name: probe-fujian-api
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测福建统一平台API连通性
        run: |
          echo "=== 1. 测试 newsList API (HTTP直连) ==="
          set +e
          curl -s -o /tmp/resp1.json -w "HTTP_CODE=%{http_code} TIME=%{time_total}s SIZE=%{size_download}\n" \
            --max-time 25 \
            "http://220.160.53.33:8903/ksbm/student/home/newsList?userId=&year=&orderBy=1&pageNum=1&pageSize=3&flag=2&isProject=1" \
            -H "User-Agent: Mozilla/5.0" -H "Accept: application/json"
          echo "--- 返回前400字符 ---"
          head -c 400 /tmp/resp1.json 2>/dev/null
          echo ""
          echo ""
          echo "=== 2. 用 python 解析验证 ==="
          python3 - <<'PY'
import json,urllib.request
try:
    req=urllib.request.Request("http://220.160.53.33:8903/ksbm/student/home/newsList?userId=&year=&orderBy=1&pageNum=1&pageSize=5&flag=2&isProject=1",
        headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
    r=urllib.request.urlopen(req,timeout=25)
    j=json.loads(r.read().decode("utf-8","ignore"))
    data=j.get("data",{})
    rows=data.get("rows",[]) if isinstance(data,dict) else []
    total=data.get("total") if isinstance(data,dict) else len(rows)
    print(f"解析成功: total={total}, 本页{len(rows)}条")
    for row in rows[:3]:
        print("  -",str(row.get("proTitle") or row.get("title"))[:50], "|", str(row.get("url"))[:60])
except Exception as e:
    print("解析失败:",type(e).__name__,str(e)[:120])
PY
