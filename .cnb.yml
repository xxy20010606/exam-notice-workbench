# CNB（cnb.cool）云原生构建 — 公考事考公告抓取
# 国内 IP 直连 gov.cn，解决 GitHub Actions 海外 IP 被封问题
# 用法：注册 cnb.cool（微信扫码）→ 新建/导入仓库 → 自动识别 .cnb.yml

main:
  # 每 6 小时定时抓取（系统时区 Asia/Shanghai，即北京时间）
  "crontab: 17 */6 * * *":
    - name: exam-notice-scrape
      runner:
        cpus: 2
      stages:
        - name: 抓取并部署
          jobs:
            - name: run-ci-scrape
              script: |
                set -e
                echo "=== Python 版本 ==="
                python3 --version || python --version
                echo "=== 安装依赖 ==="
                pip install -r requirements.txt -q
                echo "=== 安装 Playwright 浏览器 ==="
                playwright install chromium --with-deps 2>/dev/null || playwright install chromium
                echo "=== 运行 ci_scrape.sh（国内IP直连 gov.cn，仅 .has_change>0 才推回 GitHub main）==="
                bash ci_scrape.sh
                echo "=== 抓取结束 ==="

  # 手动触发（页面点"运行"）
  web_trigger:
    - name: exam-notice-scrape-manual
      runner:
        cpus: 2
      stages:
        - name: 抓取并部署
          jobs:
            - name: run-ci-scrape
              script: |
                set -e
                pip install -r requirements.txt -q
                playwright install chromium --with-deps 2>/dev/null || playwright install chromium
                bash ci_scrape.sh
